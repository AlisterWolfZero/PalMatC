<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PalMatC — Calculadora de Materiales</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1><span class="brand-pal">Pal</span><span class="brand-mat">Mat</span><span class="brand-c">C</span></h1>
    <span class="topbar-tag">Calculadora de Materiales · Palworld 1.0</span>
  </div>
</header>

<main>
  <section class="panel add-panel">
    <h2>Agregar objetivo de fabricación</h2>
    <div class="add-row">
      <input list="item-list" id="item-input" placeholder="Buscar objeto (ej. Rifle de Asalto, Pastel...)" autocomplete="off">
      <datalist id="item-list"></datalist>
      <input type="number" id="qty-input" min="1" value="1">
      <button id="add-btn">Agregar</button>
    </div>
    <ul id="goals-list" class="goals-list"></ul>
    <div class="actions">
      <button id="calc-btn" class="primary">Calcular materiales</button>
      <button id="clear-btn" class="ghost">Vaciar todo</button>
    </div>
  </section>

  <section class="panel" id="results-panel" hidden>
    <h2>Materiales base necesarios</h2>
    <p class="hint">Editá "Tengo" si ya poseés parte de los materiales — se recalcula lo que falta.</p>
    <table id="raw-table">
      <thead>
        <tr><th class="check-col"></th><th>Material</th><th>Necesario</th><th>Tengo</th><th>Falta</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="summary" id="summary"></div>

    <h2>Desglose anidado por objetivo</h2>
    <div id="trees"></div>
  </section>
</main>

<script src="recipes-data.js"></script>
<script src="app.js"></script>
</body>
</html>
